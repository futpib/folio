[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ibkr-tws-http"
version = "0.14.0"
description = "Folio: local read-only access to IBKR, Binance, Bank of Georgia and Wolt data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "cryptography>=46,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "ibapi @ git+https://github.com/deepentropy/ibapi.git@e27eff9c8cd9da7d91ffabaa4db86fec683956e7",
  "playwright>=1.56,<2",
  "protobuf==5.29.5",
  "tomlkit>=0.13,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
folio = "folio.cli:main"
foliod = "folio.cli:daemon"
ibkr-tws = "ibkr_tws_http.cli:main"
ibkr-tws-http = "ibkr_tws_http.main:main"
ibkr-tws-http-smoke = "ibkr_tws_http.smoke:main"
ibkr-tws-http-mock = "ibkr_tws_http.mock_tws:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ibkr_tws_http", "src/folio"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
